[workspace]

[package]
name = "workforce-planning-management-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = true
default-run = "workforce-planning-management-service"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Workforce planning management service — worker lifecycle, ATS, workforce, payroll"
readme = "README.md"
repository = "https://github.com/workforce-planning-management/workforce-planning-management/tree/main/workforce-planning-management-api-with-rust"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
keywords = ["wpm", "hr", "payroll", "ats", "workforce"]
categories = ["development-tools", "rust-patterns"]
include = ["src/**/*", "README.md"]

[workspace.dependencies]
# `auth` is deliberately absent from this feature list. It is loco's JWT
# support (`dep:jsonwebtoken`, and therefore `rsa` / RUSTSEC-2023-0071),
# and this family issues PASETO v4.public rather than JWT — see
# agents/share/jwt.md. Dropping it removes the vulnerable crate from the
# dependency graph rather than suppressing the advisory.
loco-rs = { version = "1.1.0", default-features = false, features = ["cli", "with-db", "cache_inmem", "worker"] }

[features]
# Exactly one token-verification backend, chosen at build time —
# `src/auth.rs` `compile_error!`s otherwise. `paseto` is the family
# default (offline PASETO v4.public against the sibling authentication
# service's published keys); `keycloak` verifies a Keycloak-issued JWT
# directly against the realm's JWKS (see `spec/auth.md`'s "Keycloak as
# the identity provider" runbook for the env vars and claim mapping).
# Both produce the same `authentication_verifier::Claims`, so the ABAC
# policy engine, `MaybeAuthUser`, and every controller are unaffected
# by the choice.
default = ["paseto"]
paseto = []
keycloak = ["dep:jsonwebtoken", "dep:aws-lc-rs"]

[dependencies]
loco-rs = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }
tokio = { version = "1.53", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
migration = { path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
uuid = { version = "1.26", features = ["v4", "serde"] }
mimalloc = { version = "0.1.52" }
prometheus = { version = "0.13" }
# Upstream display-name lookups (`http` client mode only; stub is the
# default). Same minimal reqwest configuration as the verifier's fetch.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }

# Cross-service entity references (EntityRef URN + entity-type registry):
# people/workers/organizations/courses are referenced, never duplicated.
entity-ref = { path = "crates/entity-ref" }

# Offline PASETO v4.public verification + the shared ABAC engine. The
# `Claims`/`Policy`/`Action` types here are backend-agnostic (see the
# `keycloak` feature above) — only `Verifier` (PASETO signature
# verification) is `paseto`-specific.
authentication-verifier = { path = "crates/authentication-verifier", features = ["fetch"] }

# `keycloak` feature only: direct verification of a Keycloak-issued JWT
# against the realm's JWKS. `aws_lc_rs` is the ONLY crypto backend this
# selects (`default-features = false`) — the alternative, `rust_crypto`,
# pulls in the `rsa` crate (RUSTSEC-2023-0071) that dropping loco's own
# `auth` feature above was meant to avoid. `aws_lc_rs` verifies RS256 via
# a BoringSSL derivative instead, so Keycloak's default RS256 realm keys
# stay usable without that crate in the graph.
jsonwebtoken = { version = "11", optional = true, default-features = false, features = ["aws_lc_rs"] }
# Already pulled in transitively by `jsonwebtoken`'s `aws_lc_rs` feature
# above; declared directly too so `src/auth/keycloak.rs`'s own tests can
# generate an EC test keypair without adding a second crypto crate.
aws-lc-rs = { version = "1", optional = true }

[[bin]]
name = "workforce-planning-management-service"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
# Name the `TestServer` type in shared request-test helpers (same
# version loco's testing feature uses internally).
axum-test = { version = "21.1.0" }
tokio = { version = "1.53", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "net",
] }
serial_test = { version = "4.0.1" }
# Mint PASETO v4.public tokens + a matching Ed25519 key set in-process so
# the auth path is verified without the auth service or a network.
ed25519-dalek = { version = "3.0.0" }
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"] }
sha2 = { version = "0.10" }
base64 = { version = "0.23" }
# Real Keycloak in a container for `tests/keycloak.rs` (Podman via DOCKER_HOST).
testcontainers = { version = "0.28" }

# Needs the `keycloak` backend (mutually exclusive with the default `paseto`).
[[test]]
name = "keycloak"
path = "tests/keycloak.rs"
required-features = ["keycloak"]
