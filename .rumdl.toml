# rumdl configuration for Workforce Planning Management
# Rust Markdown Linter - https://github.com/rhysd/rumdl

# Essential rules - these catch real issues
[MD009]
# Trailing spaces should be removed
enabled = true

[MD010]
# No tabs
enabled = true

[MD042]
# No empty links
enabled = true

[MD047]
# File should end with a single newline
enabled = true

# Optional rules - disabled for now, can be enabled gradually
[MD012]
enabled = false
maximum = 2

[MD013]
# Line length - start with 200 to accommodate existing content
enabled = false
line-length = 200

[MD033]
# Allow HTML for Lily Design System components
enabled = false

[MD034]
# Allow bare URLs
enabled = false

