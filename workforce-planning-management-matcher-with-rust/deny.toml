# cargo-deny policy for the matcher: advisories, licences and where code may come
# from. Only the licences this crate's dependencies use today; add one when a new
# dependency needs it. Run by the `deny` job in .github/workflows/ci.yml.

[advisories]
version = 2

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
