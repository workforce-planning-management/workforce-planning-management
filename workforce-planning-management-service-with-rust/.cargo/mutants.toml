# cargo-mutants (WPM-T526; spec/testing.md, "Mutation testing").
#
# The pure core is where a mutant should die: the rules in the domain crate (`crates/workforce-planning-management-domain/src/`, WPM-D203) are DB-free and clock-free and tested exhaustively by
# the lib's unit tests (AGENTS.md, rule 2), and `src/security.rs` holds the pure parts of the security settings. A controller is
# tested by the database-backed suites, which a mutant run cannot afford, so the controllers are not examined here.
examine_globs = ["crates/workforce-planning-management-domain/src/**/*.rs", "src/security.rs"]

# Axum wiring in `src/security.rs` that only the database-backed `tests/security.rs` binary drives (a limit refused with
# `429`, the posture probe, the route table): a unit-test run cannot catch these mutants, so they are left out here and
# stay covered by that binary in CI's `api-db` job. Found by the first run (WPM-T526).
exclude_re = [
    "in rate_limit_mw$",
    "replace rate_limit_mw -> Response",
    "replace posture -> Response",
    "replace routes -> Routes",
]

# Only the unit tests: they need no database and run in about a second.
additional_cargo_test_args = ["--lib"]

# A clean lib test run takes about a second; a mutant that loops is cut off well before CI's job limit.
timeout_multiplier = 5.0
minimum_test_timeout = 60
