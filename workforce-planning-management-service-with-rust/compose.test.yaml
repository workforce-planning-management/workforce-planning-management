# Postgres and Redis for this service's DB-gated test suite. From this directory:
#
#   podman compose -f compose.test.yaml up -d --wait
#   export WPM_TEST_REDIS_URL=redis://localhost:6379   # the Redis-backed tests skip without it
#   cargo test -- --ignored --test-threads=1
#   podman compose -f compose.test.yaml down
#
# Podman, not Docker (spec/rust-loco-stack.md).
#
# The connection details deliberately match what CI provides
# (.github/workflows/ci.yml, job `api-db`): superuser `loco`/`loco` on 5432,
# Redis 8 on 6379.
# A database a test passes against locally but CI cannot reproduce is
# worse than no local database.
services:
  postgres:
    # Fully qualified: podman refuses a short name (or prompts for a
    # registry), which would hang an unattended run.
    image: docker.io/library/postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: wpm-test-db
    environment:
      POSTGRES_USER: loco
      POSTGRES_PASSWORD: loco
      # Matches config/test.yaml, so a bare `cargo test -- --ignored`
      # finds its database.
      POSTGRES_DB: workforce_planning_management_test
    ports:
      # Override to run two databases side by side:
      #   TEST_DB_PORT=5433 podman compose -f compose.test.yaml up -d
      - "${TEST_DB_PORT:-5432}:5432"
    volumes:
      # Enables the extensions in template1, so every database created
      # later inherits them.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro,z
    tmpfs:
      # PGDATA lives under /var/lib/postgresql in the 18 image
      # (/var/lib/postgresql/18/docker — *not* the /var/lib/postgresql/data
      # of earlier majors, which is why an earlier tmpfs mount at that path
      # silently did nothing). In RAM: a test database is disposable, and
      # every `up` should start from a clean initdb.
      - /var/lib/postgresql
    healthcheck:
      # `up --wait` waits on this, so a test run cannot start against a
      # database that is still initialising.
      test: ["CMD-SHELL", "pg_isready -U loco -d workforce_planning_management_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: docker.io/library/redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    container_name: wpm-test-redis
    # A cache: nothing to keep, so no snapshots and no append-only file.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      # TEST_REDIS_PORT=6380 podman compose -f compose.test.yaml up -d
      - "${TEST_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
