# Loco configuration file — workforce-planning-management-service (production).
#
# This file previously held ONLY the `cache:` block below — no
# `server:`, `database:`, or `logger:` at all. loco's top-level
# `Config` struct declares `logger`, `server`, and `database` as
# required fields with no defaults, so this file could not have
# deserialized in production: the service would fail to boot before
# ever reaching the SEC-M1 body-limit concern. Filled out to mirror
# this crate's own development.yaml / test.yaml (same env-var names),
# plus the family's production middleware shape (person-service is the
# reference).

logger:
  enable: true
  pretty_backtrace: false
  level: info
  format: json

server:
  port: {{ get_env(name="PORT", default="5150") }}
  binding: 0.0.0.0
  host: {{ get_env(name="HOST", default="http://localhost") }}
  middlewares:
    compression:
      enable: true
    etag:
      enable: true
    # Explicit backstop (SEC-M1) — no bulk/upload feature in this
    # crate, so loco's own 2mb default is plenty for CRUD-shaped JSON;
    # made explicit rather than implicit so it is visible in the file
    # a deployer actually reads.
    limit_payload:
      enable: true
      body_limit: 2mb
    # A request that runs longer than this is answered `408` (WPM-R116), so a slow or stalled
    # caller cannot hold a worker and a database connection indefinitely. Milliseconds.
    timeout_request:
      enable: true
      timeout: {{ get_env(name="WPM_REQUEST_TIMEOUT_MS", default="30000") }}
    # CORS is an allow-list, never `*`. The UI calls this API through its own
    # server (same origin), so this lists only the browser origins that may
    # call the API directly. `WPM_CORS_ORIGIN` is required: boot fails when
    # it is unset, rather than falling back to every origin.
    cors:
      enable: true
      allow_origins:
        - {{ get_env(name="WPM_CORS_ORIGIN") }}
      allow_methods: [GET, POST, PUT, PATCH, DELETE]
      allow_headers: [authorization, content-type, accept, accepts-version]
      allow_credentials: false
      max_age: 600

workers:
  mode: BackgroundQueue

queue:
  kind: Postgres
  uri: {{ get_env(name="DATABASE_URL") }}
  dangerously_flush: false

mailer:
  smtp:
    enable: true
    host: {{ get_env(name="SMTP_HOST", default="localhost") }}
    port: {{ get_env(name="SMTP_PORT", default="587") }}
    secure: true
    auth:
      # Quoted: unset renders an empty value, which YAML reads as null and
      # the typed config rejects ("invalid type: unit value").
      user: "{{ get_env(name="SMTP_USER", default="") }}"
      password: "{{ get_env(name="SMTP_PASSWORD", default="") }}"

database:
  uri: {{ get_env(name="DATABASE_URL") }}
  enable_logging: false
  connect_timeout: {{ get_env(name="DB_CONNECT_TIMEOUT", default="500") }}
  idle_timeout: {{ get_env(name="DB_IDLE_TIMEOUT", default="500") }}
  min_connections: {{ get_env(name="DB_MIN_CONNECTIONS", default="2") }}
  max_connections: {{ get_env(name="DB_MAX_CONNECTIONS", default="20") }}
  auto_migrate: false
  dangerously_truncate: false
  dangerously_recreate: false

auth:
  jwt:
    secret: {{ get_env(name="JWT_SECRET") }}
    expiration: 604800


# Cache provider: in-memory (loco `cache_inmem`, enabled by default).
cache:
  kind: InMem
  max_capacity: 33554432 # 32MiB (default if not specified)
