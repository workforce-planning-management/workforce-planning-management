# cargo-deny supply-chain policy. Used by the `deny` job in
# `.github/workflows/ci.yml` (`cargo deny check`).

[advisories]
version = 2
yanked = "warn"
# Advisories accepted WITH a note. An entry is added only for a transitive advisory that cannot be fixed at this level without an
# upstream bump, and is removed once `cargo deny check` says it was "not encountered" (it then warns). On 2026-10-25 eleven earlier
# entries (proc-macro-error, instant, paste, protobuf, quick-xml and six more from the loco tree) no longer matched anything in the
# lockfile and were removed, so each of those advisories now fails the build again if a dependency brings it back. Real, actionable
# advisories NOT on this list fail the build.
ignore = [
    "RUSTSEC-2024-0449", # unsafe-libyaml (unmaintained), transitive (loco tree: serde_yaml); no fixed release to move to
]

[licenses]
version = 2
# Permissive licenses used across the Rust / Loco stack. A dependency
# whose license is not listed FAILS the check — a deliberate signal to
# review a new license, not to silently accept it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Local, unpublished crates (the service itself, its `migration` member)
# carry no `license` field and must not be license-checked.
private = { ignore = true }

[bans]
# Duplicate versions are a warning (the loco/sea-orm stack pulls a few);
# not a hard failure, so the gate stays green while still surfacing bloat.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
