[workspace]

[package]
name = "workforce-planning-management"
version = "0.1.3"
edition = "2024"
rust-version = "1.99"
publish = true
default-run = "workforce-planning-management"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Workforce Planning Management (WPM): service for worker lifecycle, applicant tracking system, human resources, people and organization development, continuing professional development, payroll, scheduling, training, rotas, and more."
readme = "README.md"
repository = "https://github.com/workforce-planning-management/workforce-planning-management/workforce-planning-management-service-with-rust"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
keywords = ["wpm", "hr", "payroll", "ats", "workforce"]
categories = ["development-tools", "rust-patterns"]
include = ["src/**/*", "config/**/*", "README.md", "CHANGELOG.md"]

[workspace.dependencies]
# `auth` is deliberately absent from this feature list. It is loco's JWT
# support (`dep:jsonwebtoken`, and therefore `rsa` / RUSTSEC-2023-0071),
# and this family issues PASETO v4.public rather than JWT — see
# agents/share/jwt.md. Dropping it removes the vulnerable crate from the
# dependency graph rather than suppressing the advisory.
loco-rs = { version = "1.2.0", default-features = false, features = ["cli", "with-db", "cache_inmem", "cache_redis", "worker"] }

[features]
# Exactly one token-verification backend, chosen at build time —
# `src/auth.rs` `compile_error!`s otherwise. `paseto` is the family
# default (offline PASETO v4.public against the sibling authentication
# service's published keys); `keycloak` verifies a Keycloak-issued JWT
# directly against the realm's JWKS (see `spec/auth.md`'s "Keycloak as
# the identity provider" runbook for the env vars and claim mapping).
# Both produce the same `authentication_verifier::Claims`, so the ABAC
# policy engine, `MaybeAuthUser`, and every controller are unaffected
# by the choice.
default = ["paseto"]
paseto = []
keycloak = ["dep:jsonwebtoken", "dep:aws-lc-rs"]

[dependencies]
# Request fingerprints for idempotency keys (WPM-R132).
sha2 = { version = "0.11" }
# Credential signing (WPM-R157): EdDSA over a JWS, and base64url for its parts. Both were already in the build (dev and via PASETO).
ed25519-dalek = { version = "3.0.0" }
base64 = { version = "0.23" }
loco-rs = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }
tokio = { version = "1.54", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
# `ServiceExt::oneshot`: the MCP adapter calls the API router in process under the caller's token (WPM-D101).
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
migration = { package = "workforce-planning-management-migration", path = "migration", version = "0.1.3" }
sea-orm = { version = "2.0", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
uuid = { version = "1.29", features = ["v4", "serde"] }
mimalloc = { version = "0.1.52" }
prometheus = { version = "0.14" }
# Upstream display-name lookups (`http` client mode only; stub is the
# default). Same minimal reqwest configuration as the verifier's fetch.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }

# Loco's Redis cache (`cache_redis`) pulls in `redis` with no TLS. Turning TLS on here, by
# feature unification, is what makes a `rediss://` REDIS_URL work (WPM-D78).
# Two rustls crypto providers are in the build (`ring` and `aws-lc-rs`), so rustls cannot choose one
# and a TLS connection would panic; `shared_cache::install_tls_provider` chooses `ring` at boot.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
redis = { version = "1.8", default-features = false, features = ["tokio-rustls-comp"] }

# Cross-service entity references (EntityRef URN + entity-type registry):
# people/workers/organizations/courses are referenced, never duplicated.
entity-ref = { path = "crates/entity-ref", version = "0.2" }

# Offline PASETO v4.public verification + the shared ABAC engine. The
# `Claims`/`Policy`/`Action` types here are backend-agnostic (see the
# `keycloak` feature above) — only `Verifier` (PASETO signature
# verification) is `paseto`-specific.
workforce-planning-management-matcher = "0.1"
authentication-verifier = { version = "0.9", features = ["fetch"] }

# `keycloak` feature only: direct verification of a Keycloak-issued JWT
# against the realm's JWKS. `aws_lc_rs` is the ONLY crypto backend this
# selects (`default-features = false`) — the alternative, `rust_crypto`,
# pulls in the `rsa` crate (RUSTSEC-2023-0071) that dropping loco's own
# `auth` feature above was meant to avoid. `aws_lc_rs` verifies RS256 via
# a BoringSSL derivative instead, so Keycloak's default RS256 realm keys
# stay usable without that crate in the graph.
jsonwebtoken = { version = "11", optional = true, default-features = false, features = ["aws_lc_rs"] }
# Already pulled in transitively by `jsonwebtoken`'s `aws_lc_rs` feature
# above; declared directly too so `src/auth/keycloak.rs`'s own tests can
# generate an EC test keypair without adding a second crypto crate.
aws-lc-rs = { version = "1", optional = true }

[[bin]]
name = "workforce-planning-management"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
# Name the `TestServer` type in shared request-test helpers (same
# version loco's testing feature uses internally).
axum-test = { version = "21.1.0" }
tokio = { version = "1.54", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
] }
serial_test = { version = "4.0.1" }
# Mint PASETO v4.public tokens + a matching Ed25519 key set in-process so
# the auth path is verified without the auth service or a network.
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"] }
# Real Keycloak in a container for `tests/keycloak.rs` (Podman via DOCKER_HOST).
testcontainers = { version = "0.28" }
# The `keycloak` and `oidc_entra` tests build requests with `.query` and `.form`; the service itself needs neither feature.
reqwest = { version = "0.13", default-features = false, features = ["query", "form"] }

# Needs the `keycloak` backend (mutually exclusive with the default `paseto`).
[[test]]
name = "keycloak"
path = "tests/keycloak.rs"
required-features = ["keycloak"]

# Sign in with Microsoft Entra ID, against an in-process Entra-compatible OIDC
# provider (no container runtime needed).
[[test]]
name = "oidc_entra"
path = "tests/oidc_entra.rs"
required-features = ["keycloak"]

# Developing the matcher alongside the service: uncomment to build against the
# sibling checkout instead of the published crate. Leave it commented in
# commits; the Containerfile and CI build from the registry copy, and a path
# override rewrites Cargo.lock.
# [patch.crates-io]
# workforce-planning-management-matcher = { path = "../workforce-planning-management-matcher-with-rust" }
