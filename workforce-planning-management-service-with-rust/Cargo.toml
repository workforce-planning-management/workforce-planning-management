[workspace]

[package]
name = "workforce-planning-management"
version = "0.1.4"
edition = "2024"
rust-version = "1.99"
publish = true
default-run = "workforce-planning-management"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Workforce Planning Management (WPM): service for worker lifecycle, applicant tracking system, human resources, people and organization development, continuing professional development, payroll, scheduling, training, rotas, and more."
readme = "README.md"
repository = "https://github.com/workforce-planning-management/workforce-planning-management/workforce-planning-management-service-with-rust"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only OR OGL-UK-3.0 OR CC-BY-NC-SA-4.0"
keywords = ["wpm", "hr", "payroll", "ats", "workforce"]
categories = ["development-tools", "rust-patterns"]
include = ["src/**/*", "migrations/**/*", "config/**/*", ".sqlx/**/*", ".cargo/**/*", "sqlx.toml", "README.md", "CHANGELOG.md"]

[workspace.dependencies]
axa = { version = "0.23.0", features = ["cursor-pagination", "problem", "ratelimit", "postgres-sqlx"] }

[features]
# Exactly one token-verification backend, chosen at build time —
# `src/auth.rs` `compile_error!`s otherwise. `paseto` is the family
# default (offline PASETO v4.public against the sibling authentication
# service's published keys); `keycloak` verifies a Keycloak-issued JWT
# directly against the realm's JWKS (see `spec/auth.md`'s "Keycloak as
# the identity provider" runbook for the env vars and claim mapping).
# Both produce the same `authentication_verifier::Claims`, so the ABAC
# policy engine, `MaybeAuthUser`, and every controller are unaffected
# by the choice.
default = ["paseto"]
paseto = []
keycloak = ["dep:jsonwebtoken", "dep:ring"]

[dependencies]
# Request fingerprints for idempotency keys (WPM-R132).
sha2 = { version = "0.11" }
# Credential signing (WPM-R157): EdDSA over a JWS, and base64url for its parts. Both were already in the build (dev and via PASETO).
ed25519-dalek = { version = "3.0.0" }
base64 = { version = "0.23" }
axa = { workspace = true }
# The schedule's cron expressions (`src/scheduler.rs`), on jiff 0.2, the version the service uses (WPM-T531).
croner = { version = "4.0.3", default-features = false, features = ["jiff"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }
tokio = { version = "1.54.1", default-features = false, features = [
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
# `ServiceExt::oneshot`: the MCP adapter calls the API router in process under the caller's token (WPM-D101).
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Plain SQL, checked at build time (WPM-D184): the service's only database library.
sqlx = { version = "0.9", default-features = false, features = [
  "json",
  "macros",
  "postgres",
  "runtime-tokio",
  "sqlx-toml",
  "tls-rustls-ring-webpki",
  "uuid",
] }
# Dates and times are `jiff` (WPM-T528); `jiff-sqlx` gives `sqlx` its traits, through `sql_time`. The scheduler's cron
# expressions are `croner` on jiff too (WPM-T531), so the service depends on no `chrono` of its own.
jiff = { version = "0.2.44", features = ["serde"] }
jiff-sqlx = { version = "0.2.2", features = ["postgres"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
mimalloc = { version = "0.1.52" }
prometheus = { version = "0.14.0" }
# Upstream display-name lookups (`http` client mode only; stub is the
# default). Same minimal reqwest configuration as the verifier's fetch.
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls-no-provider",
  "json",
] }

# The shared cache's Redis client (`src/shared_cache.rs`). `tokio-rustls-comp` is what makes a `rediss://` REDIS_URL work (WPM-D78).
# `ring` is the rustls provider this service chooses, and since WPM-T536 the only crypto library in either build. reqwest is
# `rustls-no-provider`, so `shared_cache::install_tls_provider` installs `ring` before a client is built.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
redis = { version = "1.8", default-features = false, features = ["tokio-rustls-comp"] }

# Cross-service entity references (EntityRef URN + entity-type registry):
# people/workers/organizations/courses are referenced, never duplicated.
entity-ref = { path = "crates/entity-ref", version = "0.2" }
# The domain logic and business rules, DB-free and clock-free (WPM-D203); re-exported as `rules`.
workforce-planning-management-domain = { path = "crates/workforce-planning-management-domain", version = "0.1" }

# Offline PASETO v4.public verification + the shared ABAC engine. The
# `Claims`/`Policy`/`Action` types here are backend-agnostic (see the
# `keycloak` feature above) — only `Verifier` (PASETO signature
# verification) is `paseto`-specific.
authentication-verifier = { version = "0.9.3", features = ["fetch"] }

# `keycloak` feature only: direct verification of a Keycloak-issued JWT
# against the realm's JWKS. Neither of its own crypto backends is built
# (`default-features = false`, no features): `rust_crypto` pulls in the
# `rsa` crate (RUSTSEC-2023-0071), and `aws_lc_rs` a second crypto library
# beside rustls's `ring`. `auth::jwt_ring` gives it a provider on `ring`
# instead (WPM-T536), which the `keycloak` feature turns on below.
jsonwebtoken = { version = "11", optional = true, default-features = false }
# `jsonwebtoken`'s signatures, under the `keycloak` feature (`auth::jwt_ring`); already in the build for rustls.
ring = { version = "0.17", optional = true }

[[bin]]
name = "workforce-planning-management"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
axa = { workspace = true }
axa-test = { version = "0.14.0" }
# Name `axum_test::TestResponse` in shared request-test helpers (the same
# version `axa-test` uses).
axum-test = { version = "21.1.0" }
tokio = { version = "1.54.1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
] }
serial_test = { version = "4.0.1" }
# Mint PASETO v4.public tokens + a matching Ed25519 key set in-process so
# the auth path is verified without the auth service or a network.
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"] }
# Real Keycloak in a container for `tests/keycloak.rs` (Podman via DOCKER_HOST).
testcontainers = { version = "0.28" }
# The `keycloak` and `oidc_entra` tests build requests with `.query` and `.form`; the service itself needs neither feature.
reqwest = { version = "0.13.5", default-features = false, features = ["query", "form"] }

# Generates the EC test keypair in `src/auth/keycloak.rs`'s tests; already in the build through rustls.
ring = { version = "0.17" }

# Benchmarks of what a request pays apart from the database (WPM-T527); the rules' own are in the domain crate (WPM-T538).
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

# What a request pays apart from the database (WPM-T527); `cargo bench --bench requests`.
[[bench]]
name = "requests"
harness = false

# Needs the `keycloak` backend (mutually exclusive with the default `paseto`).
[[test]]
name = "keycloak"
path = "tests/keycloak.rs"
required-features = ["keycloak"]

# Sign in with Microsoft Entra ID, against an in-process Entra-compatible OIDC
# provider (no container runtime needed).
[[test]]
name = "oidc_entra"
path = "tests/oidc_entra.rs"
required-features = ["keycloak"]

# Developing the matcher alongside the service: uncomment to build against the
# sibling checkout instead of the published crate. Leave it commented in
# commits; the Containerfile and CI build from the registry copy, and a path
# override rewrites Cargo.lock.
# [patch.crates-io]
# workforce-planning-management-matcher = { path = "../workforce-planning-management-matcher-with-rust" }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# RCA-ENF-4: an operator no lint reaches (in a macro, a dependency or an exception) panics, which is detectable, instead of wrapping,
# which is not. A backstop only: RCA-P-1 still forbids the panic.
[profile.release]
overflow-checks = true
