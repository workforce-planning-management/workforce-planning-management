# A demo of the service from a fresh clone, with no sibling repositories:
#
#   podman compose up --build
#   curl http://localhost:5150/_health
#   open http://localhost:5150/swagger-ui/
#
# DEMO ONLY. The demo has no identity service, so it turns sign-in enforcement
# OFF with an explicit `WPM_REQUIRE_AUTH=0`: anyone who can reach the port can
# read and write everything, with synthetic data only. The service logs a
# warning every ten minutes while this is so, and the `production` environment
# refuses to start this way. For anything else, set WPM_PASETO_KEYS_URL (or
# WPM_KEYCLOAK_JWKS_URL), remove the override and use LOCO_ENV=production
# (see spec/auth.md).
#
# This file runs the API only; the SvelteKit UI is not containerized yet
# (WPM-T123 notes this).
#
# Mail (WPM-D81): a Stalwart mail server takes the API's SMTP. It is a catch-all sink for the demo domain
# wpm.test and refuses to relay anywhere else, so nothing leaves the machine. Read what arrived with
#   python3 scripts/demo-mailbox.py            (or open http://localhost:8025/account, inbox@wpm.test)
# The credentials below and in deploy/stalwart/plan.ndjson are demo constants: never reuse them.
services:
  postgres:
    image: docker.io/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: loco
      POSTGRES_PASSWORD: loco
      POSTGRES_DB: workforce_planning_management_demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loco -d workforce_planning_management_demo"]
      interval: 3s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql

  redis:
    image: docker.io/library/redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # a cache: nothing to keep
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  stalwart:
    build:
      context: ./deploy/stalwart
      dockerfile: Containerfile
    environment:
      STALWART_RECOVERY_ADMIN: admin:wpm-demo-admin   # demo only: the administrator of this mail server
    healthcheck:
      # Ready = running normally and the demo domain and accounts exist (see deploy/stalwart/entrypoint.sh).
      test: ["CMD", "test", "-f", "/tmp/wpm-mail-ready"]
      interval: 3s
      timeout: 3s
      retries: 60
    ports:
      - "127.0.0.1:1025:25"     # SMTP, no login, only for wpm.test
      - "127.0.0.1:8025:8080"   # management, JMAP and the account web page

  api:
    build:
      context: ./workforce-planning-management-service-with-rust
      dockerfile: Containerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      stalwart:
        condition: service_healthy
    environment:
      LOCO_ENV: demo
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://loco:loco@postgres:5432/workforce_planning_management_demo
      WPM_REQUIRE_AUTH: "0"   # explicit, demo only: see the header of this file
      WPM_CORS_ORIGIN: http://localhost:5173
      SMTP_HOST: stalwart
      SMTP_PORT: "25"
    ports:
      - "127.0.0.1:5150:5150"
