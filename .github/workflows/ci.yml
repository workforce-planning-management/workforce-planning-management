name: CI

# One workflow at the repository root, because GitHub only runs workflows from
# `.github/workflows/` here. Every job is a from-scratch checkout; nothing needs
# a sibling repository (the two shared crates are vendored under
# `workforce-planning-management-service-with-rust/crates/`).
#
# Make the jobs below **required status checks** on `main` (Settings,
# Branches, Branch protection rules) so that no merge lands without a green
# build. The workflow cannot enforce that by itself.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  docs:
    name: docs, links, days, licenses, status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Markdown links resolve
        run: python3 scripts/check-links.py
      - name: durations say calendar days or business days
        run: python3 scripts/check-days.py
      - name: license fields match the LICENSE/ directory
        run: python3 scripts/check-licenses.py
      - name: every action is pinned to a commit SHA
        run: python3 scripts/check-actions-pinned.py
      - name: implementation status is current
        run: python3 scripts/status.py --check
      - name: llms.txt and llms.json are current and every path exists
        run: python3 scripts/llms.py --check

  secrets:
    name: secret scan (gitleaks, whole history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The release binary, checked against its published SHA-256, so the scanner is pinned like the actions.
      # Reviewed findings (test fixtures, development defaults) are listed with reasons in `.gitleaksignore`.
      - name: gitleaks 8.30.1
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner

  api-lint:
    name: api · fmt, clippy, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workforce-planning-management-service-with-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: workforce-planning-management-service-with-rust
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --lib

  matcher:
    name: matcher crate · fmt, clippy, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workforce-planning-management-matcher-with-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: workforce-planning-management-matcher-with-rust
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  api-db:
    name: api · database, enforcement and security suites
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workforce-planning-management-service-with-rust
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: loco
          POSTGRES_PASSWORD: loco
          POSTGRES_DB: workforce_planning_management_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://loco:loco@localhost:5432/workforce_planning_management_test
      WPM_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: workforce-planning-management-service-with-rust
          key: db
      # The request suite turns sign-in and rate limits off explicitly; each
      # of the other binaries runs in its own process because the flags are
      # read once.
      - run: cargo test --locked --test mod -- --ignored --test-threads=1
      - run: cargo test --locked --test enforcement -- --ignored --test-threads=1
      - run: cargo test --locked --test enforcement_expenses -- --ignored --test-threads=1
      - run: cargo test --locked --test enforcement_engagements -- --ignored --test-threads=1
      - run: cargo test --locked --test enforcement_need_to_know -- --ignored --test-threads=1
      - run: cargo test --locked --test enforcement_me -- --ignored --test-threads=1
      - run: cargo test --locked --test enforcement_flexible -- --ignored --test-threads=1
      - run: cargo test --locked --test enforcement_conversion -- --ignored --test-threads=1
      - run: cargo test --locked --test shared_cache_upstream
      - run: cargo test --locked --test enforcement_equality -- --ignored --test-threads=1
      - run: cargo test --locked --test enforcement_health -- --ignored --test-threads=1
      - run: cargo test --locked --test enforcement_oversight_pack -- --ignored --test-threads=1
      - run: cargo test --locked --test enforcement_cutover -- --ignored --test-threads=1
      - run: cargo test --locked --test enforcement_escalations -- --ignored --test-threads=1
      - run: cargo test --locked --test security -- --ignored --test-threads=1
      - run: cargo test --locked --test retention_schedule -- --ignored --test-threads=1
      # What the log holds for a request (WPM-R122): an id and a route, never a query string or an identifier.
      - run: cargo test --locked --test request_log -- --ignored --test-threads=1
      # Chaos: a proxy resets, swallows and slows the database connection; the seed is in the log (WPM_CHAOS_SEED replays it).
      - run: cargo test --locked --test chaos -- --ignored --nocapture

  api-oidc:
    name: api · sign in with an Entra-compatible OIDC provider
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workforce-planning-management-service-with-rust
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: loco
          POSTGRES_PASSWORD: loco
          POSTGRES_DB: workforce_planning_management_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://loco:loco@localhost:5432/workforce_planning_management_test
      WPM_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: workforce-planning-management-service-with-rust
          key: oidc
      # The provider runs inside the test process; no container runtime is needed.
      - run: cargo test --locked --no-default-features --features keycloak --test oidc_entra -- --ignored --test-threads=1
      - run: cargo clippy --locked --no-default-features --features keycloak --all-targets -- -D warnings

  restore-drill:
    name: api · backup, restore and erasure replay (the drill)
    runs-on: ubuntu-latest
    # Restores a pg_dump into an empty database, checks every table's row
    # checksum, replays an erasure made after the backup, and starts the real
    # service on the restored copy (scripts/restore-drill.sh, WPM-R89). It is a
    # smoke test of the restored data, not the request suite.
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: loco
          POSTGRES_PASSWORD: loco
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # pg_dump must be at least the server's version (18).
      - name: install the PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          # the runner image ships an older pg_dump first on PATH
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: workforce-planning-management-service-with-rust
          key: drill
      - name: build the service
        working-directory: workforce-planning-management-service-with-rust
        run: cargo build --locked --bin workforce-planning-management
      - name: restore drill
        env:
          ADMIN_DATABASE_URL: postgres://loco:loco@localhost:5432/postgres
        run: |
          export WPM_BIN="$PWD/workforce-planning-management-service-with-rust/target/debug/workforce-planning-management"
          # the service reads config/ from its working directory
          cd workforce-planning-management-service-with-rust
          ../scripts/restore-drill.sh

  api-keycloak:
    name: api · Keycloak suite
    runs-on: ubuntu-latest
    # First green on 2026-10-19 (run for d4ee6c6; it needed the same Postgres and Redis services as
    # the OIDC job). It uses Testcontainers on the runner's container socket. Green on the six runs
    # after that, so it is blocking and a required check.
    defaults:
      run:
        working-directory: workforce-planning-management-service-with-rust
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: loco
          POSTGRES_PASSWORD: loco
          POSTGRES_DB: workforce_planning_management_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://loco:loco@localhost:5432/workforce_planning_management_test
      WPM_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: workforce-planning-management-service-with-rust
          key: keycloak
      - run: cargo test --locked --no-default-features --features keycloak --test keycloak -- --ignored --test-threads=1

  api-roles:
    name: api · least-privilege database roles
    runs-on: ubuntu-latest
    # postgres-roles/roles.sql makes a migrator and a runtime role; this migrates as the first and runs the request tests
    # as the second, which must be refused every schema change and every change to the audit trail (WPM-T199).
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: loco
          POSTGRES_PASSWORD: loco
          POSTGRES_DB: workforce_planning_management_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ADMIN_DATABASE_URL: postgres://loco:loco@localhost:5432/postgres
      WPM_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: workforce-planning-management-service-with-rust
          key: roles
      - run: scripts/verify-db-roles.sh

  deny:
    name: api · supply chain (cargo deny)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workforce-planning-management-service-with-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: workforce-planning-management-service-with-rust
          key: deny
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  ui:
    name: ui · check, unit, build, lint, Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workforce-planning-management-ui-with-svelte
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.0.8
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: workforce-planning-management-ui-with-svelte/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm exec vitest run
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      # Advisory, not blocking: a new advisory against a dependency must not
      # stop unrelated merges. Dependabot opens the fixing pull request.
      - run: pnpm audit --audit-level high
        continue-on-error: true

  zap:
    name: api · OWASP ZAP baseline on the defaults
    runs-on: ubuntu-latest
    # First green on 2026-10-19 (run for d4ee6c6), after `X-Powered-By` was removed. ZAP reports warnings for things this
    # service cannot fix as an API (for example a missing anti-CSRF token), so
    # the rules file `.zap/rules.tsv` lists each accepted rule with its reason. Green on the six runs
    # after that, so it is blocking and a required check.
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: loco
          POSTGRES_PASSWORD: loco
          POSTGRES_DB: workforce_planning_management_demo
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: workforce-planning-management-service-with-rust
          key: zap
      - name: start the service with its defaults (sign-in enforced)
        working-directory: workforce-planning-management-service-with-rust
        env:
          LOCO_ENV: demo
          DATABASE_URL: postgres://loco:loco@localhost:5432/workforce_planning_management_demo
        run: |
          cargo build --locked --release --bin workforce-planning-management
          ./target/release/workforce-planning-management start > service.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:5150/_health && break; sleep 2; done
          curl -fs http://localhost:5150/_posture | grep -q '"auth_enforced":true'
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:5150/api-docs/openapi.json
          rules_file_name: .zap/rules.tsv
          fail_action: true
