name: Release

# Push a tag like `v0.1.0` to build and publish a pinnable release:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must equal `version` in workforce-planning-management-service-with-rust/Cargo.toml
# (the workflow checks). It publishes the API container image to GHCR as
# `ghcr.io/<owner>/<repo>-api:<version>` and `:<sha>`, attaches a CycloneDX
# software bill of materials, and creates a GitHub release with generated notes.
# First run: tag v0.1.0 (2026-10-19) succeeded and created the release with its SBOM.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' workforce-planning-management-service-with-rust/Cargo.toml | head -1)
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != crate version v${version}"; exit 1; }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workforce-planning-management-service-with-rust
      - name: software bill of materials
        working-directory: workforce-planning-management-service-with-rust
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --spec-version 1.5
          mv workforce-planning-management.cdx.json "$GITHUB_WORKSPACE/sbom.cdx.json"
      - id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-api"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
      - name: build and push the API image (Podman)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${REGISTRY_TOKEN}" | podman login ghcr.io --username "${REGISTRY_USER}" --password-stdin
          podman build -f workforce-planning-management-service-with-rust/Containerfile \
            -t "${IMAGE}:${GITHUB_REF_NAME}" -t "${IMAGE}:${GITHUB_SHA}" \
            workforce-planning-management-service-with-rust
          podman push "${IMAGE}:${GITHUB_REF_NAME}"
          podman push "${IMAGE}:${GITHUB_SHA}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" sbom.cdx.json \
            --title "${GITHUB_REF_NAME}" --generate-notes \
            --notes "Image: ${{ steps.meta.outputs.image }}:${GITHUB_REF_NAME} (also :${GITHUB_SHA}). Sign-in enforcement is on by default; see spec/auth.md."
