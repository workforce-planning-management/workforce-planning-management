# Dependabot version updates. One entry per ecosystem and directory, because the
# two subprojects have their own manifests (there is no root Cargo.toml or
# package.json).
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/workforce-planning-management-service-with-rust"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    groups:
      routine:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/workforce-planning-management-ui-with-svelte"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    groups:
      routine:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
  # Image digests in the compose files (WPM-T231). Dependabot does not read a `Containerfile` or the
  # service images in a workflow, so those digests (the service image, Stalwart, CI's Postgres and
  # Redis) are updated by hand; `scripts/check-actions-pinned.py` fails if one loses its digest.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "containers"]
  - package-ecosystem: "docker-compose"
    directory: "/workforce-planning-management-service-with-rust"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "containers"]
