# rumdl configuration for CI
# This file documents the rumdl linting rules used in CI

name: rumdl

# Rules enabled in CI
rules:
  # Essential rules (always enabled)
  - MD009  # Trailing spaces
  - MD010  # No tabs
  - MD042  # No empty links
  - MD047  # File ends with newline

# Rules disabled in CI (to allow existing content)
# These can be enabled gradually as the codebase is cleaned up
# - MD001  # Heading levels increment by one
# - MD003  # Heading style consistency
# - MD012  # Multiple consecutive blank lines
# - MD013  # Line length
# - MD033  # No HTML (allow Lily components)
# - MD034  # No bare URLs

# Configuration values
config:
  line-length: 200  # For MD013 when enabled
